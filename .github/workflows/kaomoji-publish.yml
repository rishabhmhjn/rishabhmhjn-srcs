name: Publish kaomoji to npm

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: kaomoji tag to publish, for example kaomoji-v0.2.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Validate tag
        run: |
          case "${{ inputs.tag_name }}" in
            kaomoji-v*.*.*) ;;
            *)
              echo "Tag must match kaomoji-v*.*.*"
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx nx build kaomoji

      - name: Publish
        run: npx nx release publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
